name: 🏷️ Release to NPM

on:
  workflow_dispatch:
    inputs:
      dryrun:
        type: boolean
        description: Dry-Run
      graduate:
        type: boolean
        description: Force Conventional Graduate
      skip_version_retry_publish:
        type: boolean
        description: "Skip running `lerna version` and run publish-only retry (useful to retry failed publish)"
      release_plan_run_id:
        type: string
        required: false
        description: "Workflow run ID containing a release plan to resume (skips versioning)"
      resume_allow_existing:
        type: string
        required: false
        description: "Manually verified existing package@versions, comma-separated (requires a recovery run ID)"

permissions:
  actions: read # download a recovery artifact from a previous workflow run
  contents: write # to be able to publish a GitHub release
  id-token: write # to enable use of OIDC for npm provenance
  issues: write # to be able to comment on released issues
  pull-requests: write # to be able to comment on released pull requests

jobs:
  deploy-npm-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Retrieve current Date Time in EST
        shell: bash
        run: echo "START_TIME=$(TZ=":America/New_York" date -R|sed 's/.....$//')" >> $GITHUB_ENV

      - name: Current datetime - ${{ env.START_TIME }}
        run: echo ${{ env.START_TIME }}

      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - if: ${{ !contains(fromJSON('["ghiscoding"]'), github.actor) }}
        name: Exit early when current actor is not allowed to push new release
        run: |
          echo "Error: Your GitHub username (${{ github.actor }}) is not on the allowed list of Admins that can run this workflow"
          exit 1

      - name: Validate recovery inputs
        shell: bash
        env:
          RECOVERY_RUN_ID: ${{ inputs.release_plan_run_id }}
          ALLOW_EXISTING: ${{ inputs.resume_allow_existing }}
        run: |
          if [[ -n "$RECOVERY_RUN_ID" && ! "$RECOVERY_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "The recovery run ID must contain only digits."
            exit 1
          fi
          if [[ -n "$ALLOW_EXISTING" && -z "$RECOVERY_RUN_ID" ]]; then
            echo "Manually accepted versions require a recovery run ID."
            exit 1
          fi

      - name: Download release recovery artifact
        if: ${{ inputs.release_plan_run_id != '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lerna-release-recovery
          path: ${{ runner.temp }}/lerna-release-recovery
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.release_plan_run_id }}

      - name: Verify release commit and workflow ref
        if: ${{ inputs.release_plan_run_id != '' }}
        shell: bash
        run: |
          release_sha=$(node -p 'JSON.parse(require("node:fs").readFileSync(process.env.RUNNER_TEMP + "/lerna-release-recovery/release.json", "utf8")).gitHead')
          if [[ ! "$release_sha" =~ ^([a-f0-9]{40}|[a-f0-9]{64})$ ]]; then
            echo "Invalid Git commit in recovery plan."
            exit 1
          fi
          if [[ "$release_sha" != "$GITHUB_SHA" ]]; then
            echo "Dispatch this workflow on a tag or branch at the release commit so npm provenance identifies the correct source."
            exit 1
          fi
          git cat-file -e "$release_sha^{commit}"

      - name: Install pnpm itself
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        with:
          install: false

      - name: Set NodeJS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          registry-url: "https://registry.npmjs.org/"
          node-version: 24

      - run: node --version
      - run: npm --version

      - name: Run pnpm install dependencies
        run: pnpm install

      - name: Linting (oxlint)
        run: pnpm lint

      - name: Formatting (oxfmt)
        run: pnpm format:check

      - name: Run TypeScript build only (no linting)
        run: pnpm build

      - if: ${{ inputs.skip_version_retry_publish != true && inputs.release_plan_run_id == '' }}
        name: Lerna Version (build query)
        shell: bash
        run: |
          if ${{inputs.dryrun == true && inputs.graduate != true}}
          then
              echo "LERNA_VERSION_TYPE=Dry-Run 🧪" >> $GITHUB_ENV
              echo "LERNA_VERSION_QUERY=pnpm run local-lerna version --yes --dry-run" >> $GITHUB_ENV
          elif ${{inputs.dryrun == true && inputs.graduate == true}}
          then
              echo "LERNA_VERSION_TYPE=Dry-Run 🧪 w/Graduate" >> $GITHUB_ENV
              echo "LERNA_VERSION_QUERY=pnpm run local-lerna version --yes --dry-run --conventional-graduate" >> $GITHUB_ENV
          elif ${{inputs.dryrun != true && inputs.graduate == true}}
          then
              echo "LERNA_VERSION_TYPE=Production 🚀 w/Graduate" >> $GITHUB_ENV
              echo "LERNA_VERSION_QUERY=pnpm run local-lerna version --yes --conventional-graduate" >> $GITHUB_ENV
          elif ${{inputs.dryrun != true && inputs.graduate != true}}
          then
              echo "LERNA_VERSION_TYPE=Production 🚀" >> $GITHUB_ENV
              echo "LERNA_VERSION_QUERY=pnpm run local-lerna version --yes" >> $GITHUB_ENV
          fi

      - if: ${{ inputs.skip_version_retry_publish != true && inputs.release_plan_run_id == '' }}
        name: Lerna Version 🏷️ ➜ ${{ env.LERNA_VERSION_TYPE }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          pnpm exec ${{ env.LERNA_VERSION_QUERY }}

      - name: Skip Lerna Version Notice
        if: ${{ inputs.skip_version_retry_publish == true }}
        run: |
          echo "skip_version_retry_publish=true — lerna version is skipped; proceeding to publish-only run."

      - name: Lerna Publish (build query)
        shell: bash
        env:
          RECOVERY_RUN_ID: ${{ inputs.release_plan_run_id }}
        run: |
          if [[ -n "$RECOVERY_RUN_ID" ]]; then
            echo "LERNA_PUBLISH_TYPE=Resume from release plan" >> $GITHUB_ENV
          elif ${{ inputs.dryrun == true }}
          then 
            echo "LERNA_PUBLISH_TYPE=Dry-Run 🧪" >> $GITHUB_ENV 
          else 
            echo "LERNA_PUBLISH_TYPE=Production 🚀" >> $GITHUB_ENV
            mkdir -p "$RUNNER_TEMP/lerna-release-recovery"
          fi

      - name: Lerna Publish 📦 ➜ ${{ env.LERNA_PUBLISH_TYPE }}
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALLOW_EXISTING: ${{ inputs.resume_allow_existing }}
          RECOVERY_RUN_ID: ${{ inputs.release_plan_run_id }}
          DRY_RUN: ${{ inputs.dryrun }}
        run: |
          echo "Running: ${{ env.LERNA_PUBLISH_TYPE }}"
          arguments=(publish)
          if [[ -n "$RECOVERY_RUN_ID" ]]; then
            arguments+=(--resume "$RUNNER_TEMP/lerna-release-recovery/release.json")
          else
            arguments+=(from-package --force-publish --release-plan "$RUNNER_TEMP/lerna-release-recovery/release.json")
          fi
          if [[ "$DRY_RUN" == "true" ]]; then
            arguments+=(--dry-run)
          fi
          arguments+=(--yes)
          if [[ -n "$ALLOW_EXISTING" ]]; then
            IFS=',' read -r -a accepted_versions <<< "$ALLOW_EXISTING"
            for index in "${!accepted_versions[@]}"; do
              accepted_versions[$index]="${accepted_versions[$index]//[[:space:]]/}"
              if [[ -z "${accepted_versions[$index]}" ]]; then
                echo "Each manually accepted package must include a name and version."
                exit 1
              fi
            done
            arguments+=(--resume-allow-existing "${accepted_versions[@]}")
          fi
          pnpm run local-lerna "${arguments[@]}"

      - name: Retain release recovery files
        if: ${{ always() && steps.publish.outcome != '' && steps.publish.outcome != 'skipped' && inputs.dryrun != true && inputs.release_plan_run_id == '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lerna-release-recovery
          path: ${{ runner.temp }}/lerna-release-recovery/
          if-no-files-found: warn
          compression-level: 0
