packages:
  # workspace packages
  - packages/**

  # e2e utilities (not published)
  - e2e-utils

  # exclude packages that are inside test directories
  - "!**/__fixtures__/**"
  - "!**/__test__/**"

# Define a catalog of version ranges.
catalog:
  ci-info: ^4.4.0
  dotenv: ^18.0.7
  has-unicode: ^2.0.1
  npm-package-arg: ^13.0.2
  npm-registry-fetch: ^19.1.1
  verkit: ^0.5.0

# add a few named catalog: for Lerna-Lite to test its own code with real projects
catalogs:
  # Can be referenced through "catalog:devDependencies"
  devDependencies:
    "@types/node": ^24.19.2
    "@types/npm-package-arg": ^6.1.4
    "@types/npmcli__package-json": ^4.0.4
    "@types/pacote": ^11.1.8
    "@types/yargs-parser": ^21.0.3
    yargs-parser: ^22.0.0

  # Can be referenced through "catalog:dependencies"
  dependencies:
    tinyexec: ^1.3.1
    write-json-file: ^7.0.0
    yaml: ^2.9.1
    yargs: ^18.2.0
    zeptomatch: ^2.1.0

# min age of 4 days in minutes (x * 24 * 60)
minimumReleaseAge: 5760

# exclude Lerna-Lite itself in order to run E2E tests without failures
minimumReleaseAgeExclude:
  - '@lerna-lite/*'

overrides:
  brace-expansion: ^5.0.12
  compression: ^1.8.2
  fast-uri: ^4.2.2
  handlebars: ^4.7.10
  http-cache-semantics: ^4.3.0
  ip-address: ^10.7.3
  js-yaml: ^5.4.3
  postcss-selector-parser: ^7.1.6
  proxy-addr: ^2.0.8
  source-map-js: ^1.2.2
